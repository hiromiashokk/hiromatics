<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hiromatics by Hiromi</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="shared.css">
<style>
/* ---- home page polish (scoped to index.html only) ---- */
.hero{position:relative;overflow:hidden;
  background:
    radial-gradient(120% 150% at 100% 0%,
      color-mix(in srgb,var(--violet) 24%, transparent), transparent 58%),
    linear-gradient(180deg,var(--panel),var(--bg2));}
.hero h2{font-size:22px}
.hero .lede{max-width:54ch}
.hero .spark{position:absolute;right:-6px;top:-22px;font-size:120px;
  opacity:.08;transform:rotate(-8deg);pointer-events:none;user-select:none}
.progress-wrap{display:flex;align-items:center;gap:12px;margin-top:16px}
.progress-wrap .bar{flex:1;margin-top:0;height:8px}
.progress-wrap .count{font-size:13px;font-weight:700;
  color:var(--accentText);white-space:nowrap}

.chapters{gap:14px}
.chapter-card{isolation:isolate;animation:cardIn .4s both;
  box-shadow:0 1px 0 #0003}
.chapter-card::after{content:attr(data-emoji);position:absolute;
  right:10px;bottom:-14px;font-size:58px;line-height:1;opacity:.10;
  transform:rotate(-8deg);transition:.2s;pointer-events:none;user-select:none}
.chapter-card:hover{transform:translateY(-3px);
  box-shadow:0 14px 32px -14px #000a, 0 0 0 1px var(--violet)}
.chapter-card:hover::after{opacity:.22;bottom:-8px}
.chapter-card:hover .desc{color:var(--ink)}
.chapter-card .num{background:linear-gradient(135deg,var(--violet),var(--violet2));
  color:#fff;border-color:transparent;box-shadow:0 4px 12px -4px #0009}
.chapter-card .go{margin-top:11px;font-size:12px;font-weight:700;
  color:var(--accentText);display:inline-flex;align-items:center;gap:6px;
  opacity:0;transform:translateX(-5px);transition:.2s}
.chapter-card:hover .go{opacity:1;transform:none}
.chapter-card .done{background:color-mix(in srgb,var(--green) 20%, transparent);
  border:1px solid var(--green);padding:2px 9px;border-radius:99px}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.chapter-card{animation:none}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand"><span>Hiromatics</span> by Hiromi</div>
    <div class="stats">
      <div class="chip">🔥 <b id="streak">0</b></div>
      <div class="chip xp">⬡ <b id="xp">0</b></div>
    </div>
    <div class="sub">Ganita Prakash · Grade 7 · pick a chapter</div>
  </header>

  <div class="panel hero">
    <div class="spark">📐</div>
    <h2>Every chapter, playable</h2>
    <p class="lede">Fifteen chapters from the Grade 7 book — each one has something to zoom into, drag around, or try
      before it turns into a quiz straight from the textbook.</p>
    <div class="progress-wrap">
      <div class="bar"><i id="homeBar"></i></div>
      <span class="count" id="homeCount">0 / 15</span>
    </div>
  </div>

  <div class="part-label">Part 1</div>
  <div class="chapters" id="part1"></div>

  <div class="part-label">Part 2</div>
  <div class="chapters" id="part2"></div>

</div>
<div id="toast"></div>

<script src="shared.js"></script>
<script>
"use strict";

const PART1 = [
  { id:"ch01", file:"ch01.html", title:"Large Numbers Around Us", desc:"Lakhs, crores and how big a lakh really is." },
  { id:"ch02", file:"ch02.html", title:"Arithmetic Expressions", desc:"Order of operations, brackets, and simplifying." },
  { id:"ch03", file:"ch03.html", title:"A Peek Beyond the Point", desc:"Zoom into a ruler to read decimals." },
  { id:"ch04", file:"ch04.html", title:"Expressions Using Letter-Numbers", desc:"Writing patterns and rules with letters." },
  { id:"ch05", file:"ch05.html", title:"Parallel and Intersecting Lines", desc:"Transversals, angles, and when lines never meet." },
  { id:"ch06", file:"ch06.html", title:"Number Play", desc:"Patterns, puzzles and playing with digits." },
  { id:"ch07", file:"ch07.html", title:"A Tale of Three Intersecting Lines", desc:"Triangles: angle sum and the exterior angle." },
  { id:"ch08", file:"ch08.html", title:"Working with Fractions", desc:"Multiplying and dividing fractions, visually." },
];

const PART2 = [
  { id:"ch09", file:"ch09.html", title:"Geometric Twins", desc:"Congruent shapes — same size, same shape." },
  { id:"ch10", file:"ch10.html", title:"Operations with Integers", desc:"Adding and subtracting on the negative side." },
  { id:"ch11", file:"ch11.html", title:"Finding Common Ground", desc:"HCF and LCM, and what they're actually for." },
  { id:"ch12", file:"ch12.html", title:"Another Peek Beyond the Point", desc:"Operations and estimation with decimals." },
  { id:"ch13", file:"ch13.html", title:"Connecting the Dots...", desc:"Reading data, bar graphs, and averages." },
  { id:"ch14", file:"ch14.html", title:"Constructions and Tilings", desc:"Symmetry, patterns, and geometric construction." },
  { id:"ch15", file:"ch15.html", title:"Finding the Unknown", desc:"Simple equations, solved on a balance." },
];

const THEME = {
  ch01:"pirate", ch02:"spark",  ch03:"aqua",  ch04:"shadow",
  ch05:"kawaii", ch06:"imp",    ch07:"ninja", ch08:"candy",
  ch09:"berry",  ch10:"ocean",  ch11:"mint",  ch12:"aqua",
  ch13:"pirate", ch14:"forest", ch15:"shadow"
};

const EMOJI = {
  ch01:"🔢", ch02:"➕", ch03:"📏", ch04:"✍️",
  ch05:"📊", ch06:"🎲", ch07:"🔺", ch08:"🍰",
  ch09:"👯", ch10:"⚖️", ch11:"🔗", ch12:"🎯",
  ch13:"📈", ch14:"🎨", ch15:"❓"
};

function card(ch, n){
  const done = BTP.isDone(ch.id);
  const theme = THEME[ch.id] || "";
  const emoji = EMOJI[ch.id] || "";
  return '<a class="chapter-card" href="'+ch.file+'"' +
    (theme ? ' data-theme="'+theme+'"' : '') +
    ' data-emoji="'+emoji+'"' +
    ' style="animation-delay:'+(n*40)+'ms">' +
    (done ? '<span class="done">✓ done</span>' : '') +
    '<div class="num">'+n+'</div>' +
    '<div class="title">'+ch.title+'</div>' +
    '<div class="desc">'+ch.desc+'</div>' +
    '<div class="go">'+(done ? 'Play again' : 'Start')+' →</div>' +
  '</a>';
}

document.getElementById("part1").innerHTML = PART1.map((c,i)=>card(c,i+1)).join("");
document.getElementById("part2").innerHTML = PART2.map((c,i)=>card(c,i+1)).join("");

// home progress: how many chapters are marked done
const ALL = PART1.concat(PART2);
const doneCount = ALL.filter(c => BTP.isDone(c.id)).length;
document.getElementById("homeBar").style.width = (doneCount / ALL.length * 100) + "%";
document.getElementById("homeCount").textContent = doneCount + " / " + ALL.length;

BTP.paintStats();
</script>
</body>
</html>
